# Sample nginx redirect rules for SlugShift parser development
# 20 redirect rules in various formats

# 1. Simple path redirect (301)
rewrite ^/blog/old-post$ /blog/new-post permanent;

# 2. Path with trailing slash
rewrite ^/products/$ /shop permanent;

# 3. Full URL redirect
rewrite ^/about-us$ https://example.com/about permanent;

# 4. Redirect with query string preservation
rewrite ^/search$ /find?$args permanent;

# 5. Regex with capture group
rewrite ^/blog/([0-9]+)/?$ /posts/$1 permanent;

# 6. Redirect to external domain
rewrite ^/legacy-page$ https://other-site.com/migrated permanent;

# 7. Case-insensitive style (common pattern)
rewrite ^/Contact$ /contact permanent;

# 8. Multiple path segments
rewrite ^/docs/old/section/page$ /docs/new/section/page permanent;

# 9. Redirect with 302 (temporary)
rewrite ^/temp-redirect$ /new-location redirect;

# 10. Root path redirect
rewrite ^/home$ / permanent;

# 11. Subpath with wildcard
rewrite ^/news/archive/(.*)$ /blog/archive/$1 permanent;

# 12. Remove trailing slash
rewrite ^/(.+)/$ /$1 permanent;

# 13. Add trailing slash
rewrite ^/category$ /category/ permanent;

# 14. Redirect with hash (fragment - nginx strips these, but document for parser)
rewrite ^/old-anchor$ /new-page#section permanent;

# 15. Date-based URL migration
rewrite ^/2023/01/old-article$ /articles/old-article permanent;

# 16. Product slug change
rewrite ^/product/widget-pro$ /products/widget-pro-v2 permanent;

# 17. Campaign URL sunset
rewrite ^/promo/summer-2023$ /campaigns/current permanent;

# 18. Short URL expansion
rewrite ^/go/xyz$ /landing/signup-form permanent;

# 19. Deprecated API path
rewrite ^/api/v1/legacy$ /api/v2/endpoint permanent;

# 20. Multi-segment with optional trailing slash
rewrite ^/resources/guides/([a-z-]+)/?$ /docs/guides/$1 permanent;

# 21. Redirect chain hop 1
rewrite ^/chain-start$ /chain-middle permanent;

# 22. Redirect chain hop 2
rewrite ^/chain-middle$ /chain-final permanent;

# 23. Redirect chain final destination
rewrite ^/chain-final$ /destination permanent;

# 24. Legacy migration chain hop 1
rewrite ^/legacy-chain$ /legacy-chain-v2 permanent;

# 25. Legacy migration chain hop 2
rewrite ^/legacy-chain-v2$ /legacy-chain-v3 permanent;
